<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="icon" href="data:,">

<body>
  <main>
    <h1>Lista de tareas</h1>

    <form id="formulario">
      <input id="titulo" type="text" placeholder="Nueva tarea" autocomplete="off" required>

    <p id="vacio">No hay tareas registradas</p>

  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>

</html>
