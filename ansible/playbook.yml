- name: Desplegar la aplicacion de tareas
  hosts: web
  become: true
  gather_facts: false
  vars:
    app_usuario: tareas
    app_dir: /opt/tareas
    servicio: tareas
    puerto: "{{ puerto_app | default(8000) }}"

  tasks:
    - name: Esperar la conexion SSH
      wait_for_connection:
        timeout: 300

    - name: Esperar a que termine cloud-init
      command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Instalar Python y sus herramientas
      apt:
        name:
          - python3-venv
          - python3-pip
        state: present
        update_cache: true

    - name: Crear usuario para el servicio
      user:
        name: "{{ app_usuario }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Crear directorio de la aplicacion
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_usuario }}"
        group: "{{ app_usuario }}"
        mode: "0755"

    - name: Copiar la aplicacion
      copy:
        src: "../app/{{ item }}"
        dest: "{{ app_dir }}/"
        owner: "{{ app_usuario }}"
        group: "{{ app_usuario }}"
        mode: "0644"
        directory_mode: "0755"
      loop:
        - main.py
        - requirements.txt
        - templates
        - static
      notify: Reiniciar servicio

    - name: Instalar dependencias en un entorno virtual
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv
      notify: Reiniciar servicio

    - name: Crear el servicio systemd
      template:
        src: tareas.service.j2
        dest: "/etc/systemd/system/{{ servicio }}.service"
        mode: "0644"
      notify: Reiniciar servicio

    - name: Iniciar y habilitar el servicio
      systemd:
        name: "{{ servicio }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: Aplicar reinicios pendientes
      meta: flush_handlers

    - name: Verificar que la aplicacion responde
      uri:
        url: "http://localhost:{{ puerto }}/health"
        status_code: 200
      register: salud
      until: salud.status == 200
      retries: 10
      delay: 3

  handlers:
    - name: Reiniciar servicio
      systemd:
        name: "{{ servicio }}"
        state: restarted
        daemon_reload: true
